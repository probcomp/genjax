name: Coverage Report

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run coverage check daily at 6 AM UTC
    - cron: "0 6 * * *"

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.0"
          enable-cache: true

      - name: Sync test environment
        run: uv sync --locked --group test

      - name: Validate codecov.yml
        run: |
          if [ -f "codecov.yml" ]; then
            echo "📋 Codecov configuration found"
            echo "OK Configuration file present and ready for Codecov"
          else
            echo "Warning  No codecov.yml found, using Codecov defaults"
          fi

      - name: Run comprehensive test suite
        run:
          uv run --locked --group test pytest tests/ -v --cov=src/genjax
          --cov-report=xml --cov-report=html --cov-report=term

      - name: Generate coverage report summary
        run: |
          echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          uv run --locked --group test coverage report --show-missing >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: genjax-coverage
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30
