name: Test Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.0"
          enable-cache: true

      - name: Sync test environment
        run: uv sync --locked --group test

      - name: Run tests
        run:
          uv run --locked --group test pytest tests/ -v --cov=src/genjax
          --cov-report=xml --cov-report=html --cov-report=term

      - name: Run doctests
        run: uv run --locked --group test xdoctest src/genjax --verbose=2
